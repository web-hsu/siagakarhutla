name: Laporan Harian Hotspot

on:
  schedule:
    - cron: "50 9 * * *"   # 10:00 UTC = 17:50 WITA (UTC+8)
  workflow_dispatch:        # tombol "Run workflow" untuk uji manual

jobs:
  laporan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright
          npx playwright install --with-deps chromium
      - name: Buat JPG + PDF lalu kirim email
        run: node .github/workflows/laporan-harian.mjs
        env:
          URL_DASHBOARD: ${{ secrets.URL_DASHBOARD }}
          URL_GAS: ${{ secrets.URL_GAS }}
          LAPORAN_TOKEN: ${{ secrets.LAPORAN_TOKEN }}
